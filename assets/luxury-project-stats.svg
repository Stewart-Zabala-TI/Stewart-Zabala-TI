<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 168" width="100%" height="100%">
  <defs>
    <linearGradient id="cardLux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <linearGradient id="specLux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="gradBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="projGlowLux" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowMini" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .ui-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }

    .gauge-spin {
      stroke-dasharray: 82 140;
      animation: gaugeSweep 3s ease-in-out infinite alternate;
    }
    .dot-live {
      animation: blinkDot 1.8s ease-in-out infinite;
    }

    @keyframes gaugeSweep {
      from { stroke-dasharray: 68 140; }
      to { stroke-dasharray: 102 140; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- ========================================================= -->
  <!-- TARJETA IZQUIERDA: PROYECTO DESTACADO (TI-METRICS)        -->
  <!-- ========================================================= -->
  <g transform="translate(4, 4)">
    <rect width="540" height="160" rx="16" fill="url(#cardLux)" stroke="url(#specLux)" stroke-width="1.2"/>
    <rect width="540" height="160" rx="16" fill="url(#projGlowLux)"/>

    <text x="28" y="32" class="ui-mono" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1.5">
      04 // PROYECTO DESTACADO
    </text>

    <!-- Pill Public Repo -->
    <rect x="392" y="18" width="120" height="22" rx="11" fill="#111520" stroke="url(#specLux)" stroke-width="1"/>
    <circle cx="406" cy="29" r="3.5" fill="#38bdf8" class="dot-live"/>
    <text x="417" y="33" class="ui-mono" fill="#cbd5e1" font-size="9.5" font-weight="600">PUBLIC REPO</text>

    <!-- Nombre del Proyecto -->
    <text x="28" y="66" class="ui-sans" fill="#f8fafc" font-size="20" font-weight="700">
      Métricas TI <tspan fill="#818cf8" font-weight="500">(TI-Metrics)</tspan>
    </text>

    <!-- Descripción -->
    <text x="28" y="92" class="ui-sans" fill="#94a3b8" font-size="13">
      Motor de Analítica de Logs y Monitoreo de Infraestructura desarrollado
    </text>
    <text x="28" y="110" class="ui-sans" fill="#94a3b8" font-size="13">
      íntegramente en Python.
    </text>

    <!-- Etiquetas Inferiores -->
    <circle cx="34" cy="136" r="5" fill="#38bdf8"/>
    <text x="46" y="140" class="ui-mono" fill="#e2e8f0" font-size="11" font-weight="600">Python</text>
    <text x="112" y="140" class="ui-mono" fill="#64748b" font-size="11">•  Log Analytics</text>
    <text x="232" y="140" class="ui-mono" fill="#64748b" font-size="11">•  Infrastructure</text>
    <text x="418" y="140" class="ui-mono" fill="#38bdf8" font-size="11" font-weight="600">Ver código →</text>
  </g>

  <!-- ========================================================= -->
  <!-- TARJETA DERECHA: LENGUAJE MÁS USADO (PYTHON 100%)         -->
  <!-- ========================================================= -->
  <g transform="translate(556, 4)">
    <rect width="440" height="160" rx="16" fill="url(#cardLux)" stroke="url(#specLux)" stroke-width="1.2"/>

    <text x="28" y="32" class="ui-mono" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1.5">
      05 // LENGUAJE MÁS USADO
    </text>

    <!-- Nombre y Porcentaje -->
    <text x="28" y="68" class="ui-sans" fill="#f8fafc" font-size="22" font-weight="700">Python</text>
    <text x="112" y="68" class="ui-mono" fill="#38bdf8" font-size="16" font-weight="700">100.0%</text>

    <!-- Barra de Progreso Linear De Lujo -->
    <rect x="28" y="86" width="275" height="8" rx="4" fill="#131824"/>
    <rect x="28" y="86" width="275" height="8" rx="4" fill="url(#gradBar)" filter="url(#glowMini)"/>

    <text x="28" y="120" class="ui-sans" fill="#94a3b8" font-size="12.5">
      Todo mi código actual y mis repositorios están
    </text>
    <text x="28" y="138" class="ui-sans" fill="#94a3b8" font-size="12.5">
      construidos en <tspan fill="#e2e8f0" font-weight="600">Python 3</tspan>.
    </text>

    <!-- Anillo Circular Animado a la Derecha -->
    <g transform="translate(366, 92)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="#131824" stroke-width="6"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="url(#gradBar)" stroke-width="5" stroke-linecap="round" transform="rotate(-90)" class="gauge-spin" filter="url(#glowMini)"/>
      <text x="0" y="4" text-anchor="middle" class="ui-mono" fill="#f8fafc" font-size="12" font-weight="700">100%</text>
    </g>
  </g>
</svg>
