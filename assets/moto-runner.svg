<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <!-- Gradientes minimalistas y elegantes -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="15%" stop-color="#0d1117" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#0d1117" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="tailTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ff0844" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bikeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .road-grid {
      stroke: #30363d;
      stroke-width: 1.5;
      stroke-dasharray: 28 45;
      animation: moveRoad 0.45s linear infinite;
    }
    .speed-line-1 {
      stroke: #58a6ff;
      stroke-width: 1.2;
      stroke-linecap: round;
      opacity: 0.45;
      stroke-dasharray: 90 350;
      animation: moveSpeed 0.7s linear infinite;
    }
    .speed-line-2 {
      stroke: #00f2fe;
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0.3;
      stroke-dasharray: 60 280;
      animation: moveSpeed 0.55s linear infinite;
    }
    .speed-line-3 {
      stroke: #ff0844;
      stroke-width: 1.2;
      stroke-linecap: round;
      opacity: 0.35;
      stroke-dasharray: 45 320;
      animation: moveSpeed 0.65s linear infinite;
    }
    .bike-group {
      animation: rideAcross 5.5s cubic-bezier(0.35, 0.05, 0.25, 0.95) infinite;
    }
    .bike-suspension {
      animation: bounce 0.28s ease-in-out infinite alternate;
    }
    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.25s linear infinite;
    }
    .hud-text {
      font-family: 'Segoe UI', 'Fira Code', monospace;
      font-size: 10px;
      fill: #8b949e;
      letter-spacing: 2px;
    }
    .hud-accent {
      fill: #58a6ff;
      font-weight: 600;
    }
    @keyframes moveRoad {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -73; }
    }
    @keyframes moveSpeed {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -440; }
    }
    @keyframes bounce {
      from { transform: translateY(0px) rotate(-0.4deg); }
      to { transform: translateY(-2.2px) rotate(0.3deg); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rideAcross {
      0% { transform: translateX(-260px); }
      35% { transform: translateX(310px); }
      65% { transform: translateX(370px); }
      100% { transform: translateX(1050px); }
    }
  </style>

  <!-- Fondo sutil -->
  <rect width="900" height="180" fill="url(#bgGrad)" rx="10"/>

  <!-- Telemetría Minimalista Superior (Guiño a Ciencia de Datos + Motos) -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" class="hud-text">TELEMETRY // <tspan class="hud-accent">DATA SCIENCE &amp; AI</tspan></text>
    <text x="670" y="0" class="hud-text">MODE: <tspan class="hud-accent">PYTHON_ENGINE</tspan></text>
    <line x1="0" y1="8" x2="840" y2="8" stroke="#21262d" stroke-width="1"/>
  </g>

  <!-- Líneas de velocidad / viento en el fondo -->
  <line x1="0" y1="62" x2="900" y2="62" class="speed-line-1"/>
  <line x1="0" y1="88" x2="900" y2="88" class="speed-line-2"/>
  <line x1="0" y1="115" x2="900" y2="115" class="speed-line-3"/>
  <line x1="0" y1="138" x2="900" y2="138" class="speed-line-1"/>

  <!-- Carretera / Pista Minimalista -->
  <line x1="0" y1="152" x2="900" y2="152" stroke="#21262d" stroke-width="2"/>
  <line x1="0" y1="152" x2="900" y2="152" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.7"/>
  <line x1="0" y1="160" x2="900" y2="160" class="road-grid"/>

  <!-- Grupo de la Moto Deportiva Minimalista -->
  <g class="bike-group">
    <g class="bike-suspension" transform="translate(0, 62)">
      
      <!-- Estela de luz trasera (Tail Light Trail) -->
      <path d="M -160 44 L 38 44 L 38 48 L -160 48 Z" fill="url(#tailTrail)" filter="url(#glow)"/>
      <path d="M -95 62 L 45 62 L 45 65 L -95 65 Z" fill="url(#neonCyan)" opacity="0.6"/>

      <!-- Haz de luz delantero (Headlight Beam) -->
      <polygon points="184,48 310,32 310,68" fill="url(#neonCyan)" opacity="0.22"/>

      <!-- Rueda Trasera -->
      <g transform="translate(52, 68)">
        <circle cx="0" cy="0" r="20" fill="#0d1117" stroke="#30363d" stroke-width="5"/>
        <circle cx="0" cy="0" r="15" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="16 8" class="wheel-spin" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="5" fill="#8b949e"/>
      </g>

      <!-- Rueda Delantera -->
      <g transform="translate(162, 68)">
        <circle cx="0" cy="0" r="20" fill="#0d1117" stroke="#30363d" stroke-width="5"/>
        <circle cx="0" cy="0" r="15" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="16 8" class="wheel-spin" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="5" fill="#8b949e"/>
      </g>

      <!-- Basculante y Chasis Inferior -->
      <path d="M 52 68 L 96 58 L 125 66 L 85 72 Z" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
      
      <!-- Horquilla Delantera -->
      <line x1="142" y1="32" x2="162" y2="68" stroke="#c9d1d9" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="146" y1="34" x2="164" y2="68" stroke="#58a6ff" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Carenado Deportivo Minimalista (Sportbike Fairing) -->
      <path d="M 35 44 
               L 72 42 
               L 92 50 
               L 116 34 
               L 150 28 
               L 184 48 
               L 168 56 
               L 142 54 
               L 124 68 
               L 94 65 
               L 72 52 
               Z" 
            fill="url(#bikeBody)" filter="url(#glow)"/>

      <!-- Detalles oscuros del motor y tanque -->
      <path d="M 92 50 L 122 46 L 132 62 L 96 62 Z" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

      <!-- Cúpula / Parabrisas Aerodinámico -->
      <path d="M 145 28 Q 162 28 176 42 L 152 36 Z" fill="#00f2fe" opacity="0.75"/>

      <!-- Piloto en posición aerodinámica (Racing Tuck) -->
      <!-- Torso y espalda -->
      <path d="M 78 44 Q 95 16 128 24 L 138 35 L 112 38 L 92 49 Z" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
      <!-- Pierna flexionada -->
      <path d="M 82 46 L 106 54 L 94 68" fill="none" stroke="#c9d1d9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Brazo hacia el manillar -->
      <path d="M 122 26 L 144 35" fill="none" stroke="#c9d1d9" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Casco Aerodinámico -->
      <path d="M 126 14 C 136 12, 146 18, 147 27 C 142 30, 130 29, 125 24 Z" fill="#f0f6fc"/>
      <!-- Visor del casco (Neón Cyan) -->
      <path d="M 138 18 C 143 20, 146 23, 146 26 L 136 24 Z" fill="#00f2fe" filter="url(#glow)"/>

      <!-- Luz trasera LED roja -->
      <line x1="34" y1="44" x2="42" y2="43" stroke="#ff0844" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <!-- Faro delantero LED -->
      <line x1="178" y1="45" x2="184" y2="48" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    </g>
  </g>
</svg>
