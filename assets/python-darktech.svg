<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="100%" height="100%">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="pyCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="pyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    .pulse-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotPy 10s linear infinite;
    }
    .scan-bar {
      animation: scanLoad 2.4s ease-in-out infinite alternate;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes rotPy {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes scanLoad {
      from { width: 110px; }
      to { width: 175px; }
    }
  </style>

  <g transform="translate(8, 6)">
    <!-- Contenedor Dark Tech -->
    <rect width="984" height="178" rx="14" fill="url(#pyBg)" stroke="#21262d" stroke-width="1.5"/>
    <rect x="0" y="28" width="4" height="122" rx="2" fill="#00f2fe" filter="url(#pyGlow)"/>

    <!-- IZQUIERDA: EMBLEMA PYTHON 100% FOCUS -->
    <g transform="translate(88, 89)">
      <circle cx="0" cy="0" r="56" fill="#0d1117" stroke="#161b22" stroke-width="6"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="55 25" class="pulse-ring" filter="url(#pyGlow)"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="12 10"/>
      
      <!-- Logo Python Estilizado Vectorial -->
      <g transform="translate(-20, -22) scale(0.9)">
        <path d="M 21 2 C 11 2 12 6 12 6 L 12 11 L 22 11 L 22 13 L 8 13 C 8 13 2 12 2 22 C 2 32 7 31 7 31 L 10 31 L 10 26 C 10 26 10 20 16 20 L 26 20 C 26 20 31 20 31 15 L 31 7 C 31 7 32 2 21 2 Z" fill="#3776AB"/>
        <circle cx="16" cy="6.5" r="1.8" fill="#ffffff"/>
        <path d="M 22 42 C 32 42 31 38 31 38 L 31 33 L 21 33 L 21 31 L 35 31 C 35 31 41 32 41 22 C 41 12 36 13 36 13 L 33 13 L 33 18 C 33 18 33 24 27 24 L 17 24 C 17 24 12 24 12 29 L 12 37 C 12 37 11 42 22 42 Z" fill="#FFD43B"/>
        <circle cx="27" cy="37.5" r="1.8" fill="#0d1117"/>
      </g>
      <text x="0" y="72" text-anchor="middle" class="mono" fill="#00f2fe" font-size="10.5" font-weight="700" letter-spacing="1.5">100% PYTHON</text>
    </g>

    <!-- CENTRO: TERMINAL DARK TECH EN VIVO -->
    <g transform="translate(178, 22)">
      <rect width="435" height="134" rx="10" fill="#05070b" stroke="#21262d" stroke-width="1.2"/>
      <!-- Barra superior de ventana terminal -->
      <rect width="435" height="24" rx="10" fill="#11161f"/>
      <circle cx="16" cy="12" r="4.5" fill="#ff0844"/>
      <circle cx="30" cy="12" r="4.5" fill="#ffbd2e"/>
      <circle cx="44" cy="12" r="4.5" fill="#00f2fe"/>
      <text x="218" y="16" text-anchor="middle" class="mono" fill="#8b949e" font-size="10">stewart@dark-tech: ~/python-core</text>

      <!-- Código Python en Terminal -->
      <text x="16" y="46" class="mono" fill="#ff0844" font-size="11.5">class <tspan fill="#00f2fe" font-weight="700">JordanStewart</tspan><tspan fill="#c9d1d9">:</tspan></text>
      <text x="32" y="66" class="mono" fill="#8b949e" font-size="11">lenguaje_actual = <tspan fill="#a5d6ff">"Python 3 (100%)"</tspan></text>
      <text x="32" y="85" class="mono" fill="#8b949e" font-size="11">camino = <tspan fill="#a5d6ff">["Ciencia de Datos", "IA"]</tspan></text>
      <text x="32" y="104" class="mono" fill="#8b949e" font-size="11">estado = <tspan fill="#00f2fe">"Aprendiendo y construyendo paso a paso"</tspan></text>
      <text x="16" y="123" class="mono" fill="#58a6ff" font-size="11">&gt;&gt;&gt; <tspan fill="#c9d1d9">ejecutar_telemetria()</tspan><tspan fill="#00f2fe" class="cursor-blink"> █</tspan></text>
    </g>

    <!-- DERECHA: RUTA DE APRENDIZAJE HONESTA (ROADMAP) -->
    <g transform="translate(636, 22)">
      <rect width="326" height="134" rx="10" fill="#0b0f17" stroke="#21262d" stroke-width="1.2"/>
      <text x="18" y="24" class="mono" fill="#00f2fe" font-size="10.5" font-weight="700" letter-spacing="1">SKILL TELEMETRY // MI PROCESO</text>

      <!-- Nivel 1 -->
      <text x="18" y="48" class="sans" fill="#f0f6fc" font-size="12" font-weight="600">🐍 Fundamentos &amp; Lógica en Python</text>
      <text x="255" y="48" class="mono" fill="#00f2fe" font-size="10" font-weight="700">[ACTIVO]</text>
      <rect x="18" y="54" width="290" height="6" rx="3" fill="#161b22"/>
      <rect x="18" y="54" width="165" height="6" rx="3" fill="url(#pyCyan)" class="scan-bar" filter="url(#pyGlow)"/>

      <!-- Nivel 2 -->
      <text x="18" y="82" class="sans" fill="#f0f6fc" font-size="12" font-weight="600">📊 Analítica de Datos &amp; Logs</text>
      <text x="235" y="82" class="mono" fill="#58a6ff" font-size="10" font-weight="700">[EN CURSO]</text>
      <rect x="18" y="88" width="290" height="6" rx="3" fill="#161b22"/>
      <rect x="18" y="88" width="120" height="6" rx="3" fill="#58a6ff"/>

      <!-- Nivel 3 -->
      <text x="18" y="116" class="sans" fill="#8b949e" font-size="12" font-weight="600">🧠 Inteligencia Artificial &amp; ML</text>
      <text x="222" y="116" class="mono" fill="#ff0844" font-size="10" font-weight="700">[PRÓXIMO NIVEL]</text>
    </g>
  </g>
</svg>
