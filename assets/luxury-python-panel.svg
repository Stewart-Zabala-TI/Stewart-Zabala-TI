<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 195" width="100%" height="100%">
  <defs>
    <linearGradient id="pyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141b21"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </linearGradient>

    <linearGradient id="pySpec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ff7a00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="pyBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="60%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffa940"/>
    </linearGradient>

    <radialGradient id="pyAmbient" cx="12%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0"/>
    </radialGradient>

    <filter id="pySoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .ui-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }

    .ring-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: slowSpin 16s linear infinite;
    }
    .cursor-fade { animation: blinkCursor 1.1s step-end infinite; }
    .prog-pulse { animation: barPulse 2.6s ease-in-out infinite alternate; }

    @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes barPulse { from { width: 170px; } to { width: 210px; } }
  </style>

  <g transform="translate(4, 4)">
    <rect width="992" height="186" rx="16" fill="url(#pyGlass)" stroke="url(#pySpec)" stroke-width="1.2"/>
    <rect width="992" height="186" rx="16" fill="url(#pyAmbient)"/>

    <!-- 1. IZQUIERDA: EMBLEMA PYTHON INSTITUCIONAL UHE -->
    <g transform="translate(95, 93)">
      <circle cx="0" cy="0" r="56" fill="#0d1216" stroke="#1e2629" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="url(#pyBarGrad)" stroke-width="2" stroke-dasharray="48 24" class="ring-spin" filter="url(#pySoftGlow)"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

      <!-- Logo Python en Naranja UHE & Ámbar -->
      <g transform="translate(-19, -20) scale(0.88)">
        <path d="M 21 2 C 11 2 12 6 12 6 L 12 11 L 22 11 L 22 13 L 8 13 C 8 13 2 12 2 22 C 2 32 7 31 7 31 L 10 31 L 10 26 C 10 26 10 20 16 20 L 26 20 C 26 20 31 20 31 15 L 31 7 C 31 7 32 2 21 2 Z" fill="#ff5a1f"/>
        <circle cx="16" cy="6.5" r="1.8" fill="#0d1216"/>
        <path d="M 22 42 C 32 42 31 38 31 38 L 31 33 L 21 33 L 21 31 L 35 31 C 35 31 41 32 41 22 C 41 12 36 13 36 13 L 33 13 L 33 18 C 33 18 33 24 27 24 L 17 24 C 17 24 12 24 12 29 L 12 37 C 12 37 11 42 22 42 Z" fill="#ffa940"/>
        <circle cx="27" cy="37.5" r="1.8" fill="#0d1216"/>
      </g>

      <text x="0" y="74" text-anchor="middle" class="ui-mono" fill="#ffffff" font-size="10" font-weight="600" letter-spacing="1.5">
        PYTHON // UHE
      </text>
    </g>

    <!-- 2. CENTRO: VENTANA DE CÓDIGO REAL DE FUNDAMENTOS -->
    <g transform="translate(185, 22)">
      <rect width="435" height="142" rx="12" fill="#0a0e12" stroke="url(#pySpec)" stroke-width="1"/>
      <rect width="435" height="26" rx="12" fill="#141c22"/>
      <circle cx="16" cy="13" r="4.5" fill="#ff5a1f"/>
      <circle cx="30" cy="13" r="4.5" fill="#ffa940"/>
      <circle cx="44" cy="13" r="4.5" fill="#475569"/>
      <text x="217" y="17" text-anchor="middle" class="ui-mono" fill="#8c97a0" font-size="10">fundamentos_prog.py — Universidad Hemisferios</text>

      <text x="20" y="48" class="ui-mono" fill="#ff7a00" font-size="11"># Programación I • UHE (Quito)</text>
      <text x="20" y="68" class="ui-mono" fill="#ffffff" font-size="11">materia = <tspan fill="#ffa940">"Fundamentos de Programación"</tspan></text>
      <text x="20" y="87" class="ui-mono" fill="#ffffff" font-size="11">lenguaje = <tspan fill="#ff5a1f">"Python 3"</tspan></text>
      <text x="20" y="106" class="ui-mono" fill="#cbd5e1" font-size="11">aprendiendo = <tspan fill="#ffa940">["Variables", "Bucles", "Funciones"]</tspan></text>
      <text x="20" y="128" class="ui-mono" fill="#8c97a0" font-size="10.5">&gt;&gt;&gt; <tspan fill="#ff7a00">estudiante.practicar_ejercicios()</tspan><tspan fill="#ffffff" class="cursor-fade"> ▋</tspan></text>
    </g>

    <!-- 3. DERECHA: RUTA REAL DE APRENDIZAJE ACADÉMICA -->
    <g transform="translate(642, 22)">
      <rect width="326" height="142" rx="12" fill="#0c1216" stroke="url(#pySpec)" stroke-width="1"/>
      <text x="20" y="25" class="ui-mono" fill="#8c97a0" font-size="10" font-weight="600" letter-spacing="1.2">
        PLAN DE ESTUDIO // MATERIA ACTUAL
      </text>

      <!-- Nivel 1 -->
      <text x="20" y="50" class="ui-sans" fill="#ffffff" font-size="12" font-weight="600">1. Sintaxis Básica, Variables y Tipos</text>
      <text x="250" y="50" class="ui-mono" fill="#ff5a1f" font-size="9.5" font-weight="600">EN CLASE</text>
      <rect x="20" y="57" width="286" height="5" rx="2.5" fill="#1a2228"/>
      <rect x="20" y="57" width="190" height="5" rx="2.5" fill="url(#pyBarGrad)" class="prog-pulse"/>

      <!-- Nivel 2 -->
      <text x="20" y="86" class="ui-sans" fill="#ffffff" font-size="12" font-weight="600">2. Condicionales, Bucles y Listas</text>
      <text x="245" y="86" class="ui-mono" fill="#ffa940" font-size="9.5" font-weight="600">EN CURSO</text>
      <rect x="20" y="93" width="286" height="5" rx="2.5" fill="#1a2228"/>
      <rect x="20" y="93" width="130" height="5" rx="2.5" fill="#ff7a00"/>

      <!-- Nivel 3 -->
      <text x="20" y="122" class="ui-sans" fill="#cbd5e1" font-size="12" font-weight="500">3. Funciones y Manejo de Datos</text>
      <text x="225" y="122" class="ui-mono" fill="#8c97a0" font-size="9.5" font-weight="600">PRÓXIMO TEMA</text>
      <rect x="20" y="129" width="286" height="5" rx="2.5" fill="#1a2228"/>
      <rect x="20" y="129" width="50" height="5" rx="2.5" fill="#475569"/>
    </g>
  </g>
</svg>
