<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 235" width="100%" height="100%">
  <defs>
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#0b1019"/>
      <stop offset="100%" stop-color="#06090f"/>
    </linearGradient>

    <linearGradient id="snakeBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="45%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="snakeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patrón de cuadrícula de contribuciones de GitHub (Cada celda 14x14 con espacio de 4px = 18px) -->
    <pattern id="commitGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="13" height="13" rx="3" fill="#121822" stroke="#1b2332" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }

    /* Animación de la Serpiente Cyber-Python recorriendo el tablero */
    .cyber-snake {
      stroke-dasharray: 185 1600;
      stroke-dashoffset: 1785;
      animation: snakeHunt 6.5s linear infinite;
    }

    /* Manzanas / Commits luminosos que parpadean al ser comidos */
    .commit-node-1 { animation: eatNode 6.5s ease-in-out infinite; }
    .commit-node-2 { animation: eatNode 6.5s ease-in-out 1.4s infinite; }
    .commit-node-3 { animation: eatNode 6.5s ease-in-out 2.8s infinite; }
    .commit-node-4 { animation: eatNode 6.5s ease-in-out 4.2s infinite; }

    @keyframes snakeHunt {
      0% { stroke-dashoffset: 1785; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes eatNode {
      0%, 35% { opacity: 1; transform: scale(1); }
      45%, 80% { opacity: 0.2; transform: scale(0.7); }
      95%, 100% { opacity: 1; transform: scale(1); }
    }
  </style>

  <g transform="translate(8, 6)">
    <!-- Marco Dark Tech Principal -->
    <rect width="984" height="222" rx="14" fill="url(#snakeBg)" stroke="#21262d" stroke-width="1.5"/>

    <!-- Barra Superior Arcade / Telemetría -->
    <g transform="translate(26, 26)">
      <circle cx="6" cy="-4" r="4.5" fill="#00f2fe" filter="url(#snakeGlow)"/>
      <text x="18" y="0" class="mono" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1.2">
        PYTHON CYBER-SNAKE // <tspan fill="#00f2fe">GITHUB CONTRIBUTION MATRIX</tspan>
      </text>
      <text x="695" y="0" class="mono" fill="#8b949e" font-size="11">
        MODE: <tspan fill="#ff0844" font-weight="700">DARK_TECH_ARCADE</tspan>
      </text>
    </g>

    <!-- Tablero de Contribuciones (50 columnas x 7 filas = 900x126) -->
    <g transform="translate(42, 46)">
      <!-- Fondo de celdas vacías -->
      <rect x="0" y="0" width="900" height="126" fill="url(#commitGrid)"/>

      <!-- Celdas de Commits Activas (Verdes / Cian / Carmesí estilo Dark Tech) -->
      <g transform="translate(2, 2)">
        <!-- Commits repartidos por el tablero -->
        <rect x="54" y="18" width="13" height="13" rx="3" fill="#0d4429"/>
        <rect x="72" y="36" width="13" height="13" rx="3" fill="#006d32"/>
        <rect x="126" y="36" width="13" height="13" rx="3" fill="#00f2fe" class="commit-node-1" filter="url(#snakeGlow)"/>
        <rect x="198" y="72" width="13" height="13" rx="3" fill="#1f6feb"/>
        <rect x="270" y="90" width="13" height="13" rx="3" fill="#00f2fe" class="commit-node-2" filter="url(#snakeGlow)"/>
        <rect x="342" y="18" width="13" height="13" rx="3" fill="#26a641"/>
        <rect x="432" y="18" width="13" height="13" rx="3" fill="#ff0844" class="commit-node-3" filter="url(#snakeGlow)"/>
        <rect x="504" y="54" width="13" height="13" rx="3" fill="#1f6feb"/>
        <rect x="576" y="90" width="13" height="13" rx="3" fill="#00f2fe" class="commit-node-2" filter="url(#snakeGlow)"/>
        <rect x="648" y="36" width="13" height="13" rx="3" fill="#006d32"/>
        <rect x="720" y="36" width="13" height="13" rx="3" fill="#ff0844" class="commit-node-4" filter="url(#snakeGlow)"/>
        <rect x="792" y="72" width="13" height="13" rx="3" fill="#26a641"/>
        
        <!-- Tus contribuciones recientes reales de Octubre (Derecha del calendario) -->
        <rect x="846" y="0" width="13" height="13" rx="3" fill="#39d353" filter="url(#snakeGlow)"/>
        <rect x="864" y="0" width="13" height="13" rx="3" fill="#39d353" filter="url(#snakeGlow)"/>
        <rect x="882" y="18" width="13" height="13" rx="3" fill="#00f2fe" filter="url(#snakeGlow)"/>
        <rect x="864" y="108" width="13" height="13" rx="3" fill="#39d353" filter="url(#snakeGlow)"/>
      </g>

      <!-- RUTA DE LA SERPIENTE CYBER-PYTHON CAZANDO LOS COMMITS -->
      <path d="M 8 24 
               L 134 24 
               L 134 42 
               L 278 42 
               L 278 96 
               L 350 96 
               L 350 24 
               L 440 24 
               L 440 60 
               L 584 60 
               L 584 96 
               L 656 96 
               L 656 42 
               L 728 42 
               L 728 78 
               L 854 78 
               L 854 6 
               L 892 6" 
            fill="none" 
            stroke="url(#snakeBodyGrad)" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            class="cyber-snake" 
            filter="url(#snakeGlow)"/>
    </g>

    <!-- Leyenda Inferior Dark Tech -->
    <g transform="translate(42, 198)">
      <text x="0" y="0" class="mono" fill="#8b949e" font-size="10">
        🐍 <tspan fill="#c9d1d9">La serpiente de Python recorre el tablero devorando cada nuevo commit del repositorio.</tspan>
      </text>
      <text x="720" y="0" class="mono" fill="#8b949e" font-size="10">MENOS</text>
      <rect x="762" y="-9" width="11" height="11" rx="2" fill="#121822" stroke="#21262d"/>
      <rect x="777" y="-9" width="11" height="11" rx="2" fill="#0d4429"/>
      <rect x="792" y="-9" width="11" height="11" rx="2" fill="#1f6feb"/>
      <rect x="807" y="-9" width="11" height="11" rx="2" fill="#00f2fe"/>
      <rect x="822" y="-9" width="11" height="11" rx="2" fill="#ff0844"/>
      <text x="840" y="0" class="mono" fill="#8b949e" font-size="10">MÁS</text>
    </g>
  </g>
</svg>
