<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Fondo Obsidiana Profundo (Estilo Linear / Apple Pro) -->
    <linearGradient id="bgLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="50%" stop-color="#090b11"/>
      <stop offset="100%" stop-color="#06070b"/>
    </linearGradient>

    <!-- Nebulosa Indigo / Violeta Sutil (Ambient Light) -->
    <radialGradient id="nebulaViolet" cx="76%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebulosa Ice Cyan Sutil -->
    <radialGradient id="nebulaCyan" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente Metálico Apple para el Nombre -->
    <linearGradient id="titleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Gradiente Linear para Subtítulo (Ice Cyan a Indigo) -->
    <linearGradient id="subLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Borde Especular de Cristal (Glassmorphism) -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Relleno de Cristal Oscuro -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161923" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d0f17" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Anillo Orbital Gradiente -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="softBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="heroClip">
      <rect x="0" y="0" width="1000" height="350" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .ui-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }

    .orbit-cw {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotCW 18s linear infinite;
    }
    .orbit-ccw {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotCCW 14s linear infinite;
    }
    .float-core {
      animation: floatGentle 4.5s ease-in-out infinite alternate;
    }
    .star-twinkle-1 { animation: twinkle 3s ease-in-out infinite alternate; }
    .star-twinkle-2 { animation: twinkle 4.2s ease-in-out 1.2s infinite alternate; }
    .star-twinkle-3 { animation: twinkle 2.6s ease-in-out 0.7s infinite alternate; }
    .shooting-code {
      stroke-dasharray: 65 480;
      animation: shootStar 4.8s linear infinite;
    }
    .status-pulse {
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes rotCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes floatGentle {
      0% { transform: translateY(-4px); }
      100% { transform: translateY(4px); }
    }
    @keyframes twinkle {
      0% { opacity: 0.18; }
      100% { opacity: 0.85; }
    }
    @keyframes shootStar {
      from { stroke-dashoffset: 545; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

  <g clip-path="url(#heroClip)">
    <!-- 1. FONDO Y LUCES AMBIENTALES ESPACIALES -->
    <rect width="1000" height="350" fill="url(#bgLuxury)"/>
    <rect width="1000" height="350" fill="url(#nebulaCyan)"/>
    <rect width="1000" height="350" fill="url(#nebulaViolet)"/>

    <!-- Cuadrícula Espacial Ultra Sutil (Linear Grid) -->
    <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
      <line x1="0" y1="70" x2="1000" y2="70"/>
      <line x1="0" y1="140" x2="1000" y2="140"/>
      <line x1="0" y1="210" x2="1000" y2="210"/>
      <line x1="0" y1="280" x2="1000" y2="280"/>
      <line x1="200" y1="0" x2="200" y2="350"/>
      <line x1="400" y1="0" x2="400" y2="350"/>
      <line x1="600" y1="0" x2="600" y2="350"/>
      <line x1="800" y1="0" x2="800" y2="350"/>
    </g>

    <!-- Constelación de Datos y Estrellas en el Fondo -->
    <g stroke="#818cf8" stroke-opacity="0.18" stroke-width="0.8">
      <line x1="480" y1="55" x2="545" y2="85"/>
      <line x1="545" y1="85" x2="610" y2="48"/>
      <line x1="545" y1="85" x2="585" y2="135"/>
      <line x1="885" y1="65" x2="940" y2="105"/>
      <line x1="940" y1="105" x2="915" y2="165"/>
    </g>
    <circle cx="480" cy="55" r="2" fill="#38bdf8" class="star-twinkle-1"/>
    <circle cx="545" cy="85" r="2.5" fill="#c084fc" class="star-twinkle-2"/>
    <circle cx="610" cy="48" r="1.8" fill="#ffffff" class="star-twinkle-3"/>
    <circle cx="585" cy="135" r="2" fill="#38bdf8" class="star-twinkle-1"/>
    <circle cx="885" cy="65" r="2" fill="#818cf8" class="star-twinkle-2"/>
    <circle cx="940" cy="105" r="2.5" fill="#38bdf8" class="star-twinkle-3"/>
    <circle cx="915" cy="165" r="1.5" fill="#ffffff" class="star-twinkle-1"/>
    <circle cx="120" cy="42" r="1.5" fill="#ffffff" class="star-twinkle-2"/>
    <circle cx="340" cy="308" r="2" fill="#818cf8" class="star-twinkle-3"/>

    <!-- Estrellas Fugaces de Datos (Shooting Data Streams) -->
    <line x1="380" y1="20" x2="620" y2="140" stroke="url(#subLinear)" stroke-width="1.2" stroke-linecap="round" opacity="0.45" class="shooting-code"/>
    <line x1="520" y1="240" x2="760" y2="340" stroke="url(#subLinear)" stroke-width="1" stroke-linecap="round" opacity="0.35" class="shooting-code"/>

    <!-- ================================================================= -->
    <!-- LADO IZQUIERDO: TIPOGRAFÍA DE LUJO Y BADGES GLASSMORPHISM         -->
    <!-- ================================================================= -->
    <g transform="translate(52, 46)">

      <!-- Pill Superior: Estado de Estudiante / Aprendizaje -->
      <rect x="0" y="0" width="320" height="28" rx="14" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8" class="status-pulse" filter="url(#softBloom)"/>
      <text x="30" y="18" class="ui-mono" fill="#cbd5e1" font-size="10.5" font-weight="600" letter-spacing="1.2">
        UNDERGRADUATE // ALWAYS LEARNING 🚀
      </text>

      <!-- Nombre Principal -->
      <text x="0" y="74" class="ui-sans" fill="url(#titleMetal)" font-size="34" font-weight="800" letter-spacing="-0.5">
        Jordan Stewart Zabala
      </text>

      <!-- Carrera / Enfoque en Gradiente Linear -->
      <text x="0" y="108" class="ui-sans" fill="url(#subLinear)" font-size="19" font-weight="700" letter-spacing="1.5">
        CIENCIA DE DATOS E INTELIGENCIA ARTIFICIAL
      </text>

      <!-- Descripción minimalista -->
      <text x="0" y="138" class="ui-sans" fill="#94a3b8" font-size="13.5">
        Construyendo soluciones basadas en datos y aprendiendo paso a paso con <tspan fill="#e2e8f0" font-weight="600">Python</tspan>.
      </text>

      <!-- 4 Badges en Dark Glassmorphism (2x2 Grid limpio) -->
      <g transform="translate(0, 164)">
        <!-- Badge 1 -->
        <rect x="0" y="0" width="175" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="87.5" y="21" text-anchor="middle" class="ui-mono" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="0.8">
          [ PYTHON CORE ]
        </text>

        <!-- Badge 2 -->
        <rect x="188" y="0" width="185" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="280.5" y="21" text-anchor="middle" class="ui-mono" fill="#818cf8" font-size="11" font-weight="600" letter-spacing="0.8">
          [ DATA SCIENCE ]
        </text>

        <!-- Badge 3 -->
        <rect x="0" y="44" width="175" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="87.5" y="65" text-anchor="middle" class="ui-mono" fill="#c084fc" font-size="11" font-weight="600" letter-spacing="0.8">
          [ AI &amp; ANALYTICS ]
        </text>

        <!-- Badge 4 -->
        <rect x="188" y="44" width="185" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="280.5" y="65" text-anchor="middle" class="ui-mono" fill="#e2e8f0" font-size="11" font-weight="600" letter-spacing="0.8">
          [ MOTO SPIRIT 🏍️ ]
        </text>
      </g>

    </g>

    <!-- ================================================================= -->
    <!-- LADO DERECHO: OBSERVATORIO CÓSMICO & SELLO OCTOCAT / IA ANIMADO   -->
    <!-- ================================================================= -->
    <g transform="translate(765, 175)">

      <!-- Halo Cósmico Exterior -->
      <circle cx="0" cy="0" r="128" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8"/>

      <!-- Anillo Orbital 1 (Giro Horario) -->
      <g class="orbit-cw">
        <circle cx="0" cy="0" r="112" fill="none" stroke="url(#orbitGrad)" stroke-width="1.8"/>
        <circle cx="0" cy="-112" r="4" fill="#38bdf8" filter="url(#softBloom)"/>
        <circle cx="112" cy="0" r="2.5" fill="#818cf8"/>
      </g>

      <!-- Anillo Orbital Planetario Inclinado (Efecto 3D) -->
      <g transform="rotate(-24) scale(1, 0.42)">
        <circle cx="0" cy="0" r="148" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.55" filter="url(#softBloom)"/>
        <circle cx="0" cy="0" r="136" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="40 20" class="orbit-cw"/>
      </g>

      <!-- Anillo Orbital 2 (Giro Antihorario) -->
      <g class="orbit-ccw">
        <circle cx="0" cy="0" r="84" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="28 16" stroke-opacity="0.7"/>
        <circle cx="-84" cy="0" r="3.5" fill="#c084fc" filter="url(#softBloom)"/>
      </g>

      <!-- Escudo Hexagonal / Cristal Central (Flotando Suavemente) -->
      <g class="float-core">
        <!-- Escudo Exterior Cibernético -->
        <polygon points="0,-68 58,-34 58,34 0,68 -58,34 -58,-34" fill="url(#glassFill)" stroke="url(#subLinear)" stroke-width="2" filter="url(#softBloom)"/>
        <polygon points="0,-58 49,-28 49,28 0,58 -49,28 -49,-28" fill="#07090e" stroke="#1e293b" stroke-width="1"/>

        <!-- Líneas de circuito internas del escudo -->
        <g stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.45">
          <line x1="0" y1="-58" x2="0" y2="-38"/>
          <line x1="49" y1="-28" x2="32" y2="-18"/>
          <line x1="-49" y1="-28" x2="-32" y2="-18"/>
          <line x1="49" y1="28" x2="32" y2="18"/>
          <line x1="-49" y1="28" x2="-32" y2="18"/>
        </g>

        <!-- Silueta Minimalista de Octocat / Núcleo IA en el Centro -->
        <circle cx="0" cy="0" r="28" fill="#0d111a" stroke="url(#glassBorder)" stroke-width="1.5"/>
        <!-- Cabeza y orejas estilo Octocat minimalista -->
        <path d="M -14 -6 
                 L -16 -17 L -7 -12 
                 Q 0 -15 7 -12 
                 L 16 -17 L 14 -6 
                 C 18 2, 16 12, 8 15 
                 L 8 22 L -8 22 L -8 15 
                 C -16 12, -18 2, -14 -6 Z" 
              fill="url(#subLinear)" opacity="0.92"/>
        <!-- Visor / Ojos Luminosos -->
        <rect x="-9" y="-4" width="6" height="3" rx="1.5" fill="#050609"/>
        <rect x="3" y="-4" width="6" height="3" rx="1.5" fill="#050609"/>
      </g>

      <!-- Coordenadas HUD Espaciales alrededor del observatorio -->
      <text x="-135" y="-112" class="ui-mono" fill="#64748b" font-size="9" letter-spacing="1">SYS.ORBIT // 01</text>
      <text x="65" y="122" class="ui-mono" fill="#38bdf8" font-size="9" letter-spacing="1">PY.CORE // 3.12</text>
    </g>

    <!-- Marco HUD Perimetral Minimalista -->
    <rect x="12" y="12" width="976" height="326" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="28" y="326" class="ui-mono" fill="#475569" font-size="9" letter-spacing="1.5">COORDS: 00°13'S 78°30'W // STEWART-ZABALA-TI</text>
    <text x="835" y="326" class="ui-mono" fill="#475569" font-size="9" letter-spacing="1.5">STATUS: OPERATIONAL</text>

    <!-- Borde Exterior Cristal -->
    <rect x="0.75" y="0.75" width="998.5" height="348.5" rx="17.25" fill="none" stroke="url(#glassBorder)" stroke-width="1.5"/>
  </g>
</svg>
