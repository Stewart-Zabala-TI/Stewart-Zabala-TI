<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Fondo Carbón Oscuro Institucional UHE -->
    <linearGradient id="bgUHE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e12"/>
      <stop offset="50%" stop-color="#12181d"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>

    <!-- Resplandor Naranja Institucional UHE -->
    <radialGradient id="glowOrange" cx="78%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#ff7a00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor Ámbar Superior -->
    <radialGradient id="glowAmber" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffa940" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#ff5a1f" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente Nombre Blanco Metálico -->
    <linearGradient id="titleWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Gradiente Naranja UHE -->
    <linearGradient id="orangeUHE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="60%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffa940"/>
    </linearGradient>

    <!-- Borde Especular de Cristal con acento UHE -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ff7a00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Relleno Cristal Dark Carbón -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182026" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1418" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Anillo Orbital Naranja UHE -->
    <linearGradient id="orbitUHE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ff7a00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffa940" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="heroClip">
      <rect x="0" y="0" width="1000" height="350" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .ui-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }

    .orbit-cw {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotCW 18s linear infinite;
    }
    .orbit-ccw {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotCCW 14s linear infinite;
    }
    .float-core {
      animation: floatGentle 4.5s ease-in-out infinite alternate;
    }
    .star-twinkle-1 { animation: twinkle 3s ease-in-out infinite alternate; }
    .star-twinkle-2 { animation: twinkle 4.2s ease-in-out 1.2s infinite alternate; }
    .status-pulse { animation: dotPulse 2s ease-in-out infinite; }

    @keyframes rotCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes floatGentle { 0% { transform: translateY(-4px); } 100% { transform: translateY(4px); } }
    @keyframes twinkle { 0% { opacity: 0.18; } 100% { opacity: 0.85; } }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <g clip-path="url(#heroClip)">
    <!-- 1. FONDO Y LUCES AMBIENTALES UHE -->
    <rect width="1000" height="350" fill="url(#bgUHE)"/>
    <rect width="1000" height="350" fill="url(#glowAmber)"/>
    <rect width="1000" height="350" fill="url(#glowOrange)"/>

    <!-- Retícula Sutil Carbón UHE -->
    <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
      <line x1="0" y1="70" x2="1000" y2="70"/>
      <line x1="0" y1="140" x2="1000" y2="140"/>
      <line x1="0" y1="210" x2="1000" y2="210"/>
      <line x1="0" y1="280" x2="1000" y2="280"/>
      <line x1="200" y1="0" x2="200" y2="350"/>
      <line x1="400" y1="0" x2="400" y2="350"/>
      <line x1="600" y1="0" x2="600" y2="350"/>
      <line x1="800" y1="0" x2="800" y2="350"/>
    </g>

    <!-- Constelaciones y Puntos de Luz -->
    <circle cx="480" cy="55" r="2" fill="#ff7a00" class="star-twinkle-1"/>
    <circle cx="545" cy="85" r="2.5" fill="#ffa940" class="star-twinkle-2"/>
    <circle cx="610" cy="48" r="1.8" fill="#ffffff" class="star-twinkle-1"/>
    <circle cx="885" cy="65" r="2" fill="#ff5a1f" class="star-twinkle-2"/>
    <circle cx="940" cy="105" r="2.5" fill="#ffa940" class="star-twinkle-1"/>

    <!-- ================================================================= -->
    <!-- LADO IZQUIERDO: DATOS REALES DE ESTUDIANTE EN UHE                 -->
    <!-- ================================================================= -->
    <g transform="translate(52, 44)">

      <!-- Pill Superior: Estudiante en Universidad Hemisferios -->
      <rect x="0" y="0" width="375" height="28" rx="14" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#ff5a1f" class="status-pulse" filter="url(#softGlow)"/>
      <text x="30" y="18" class="ui-mono" fill="#f8fafc" font-size="10.5" font-weight="600" letter-spacing="1">
        UNIVERSIDAD HEMISFERIOS // QUITO, ECUADOR 🇪🇨
      </text>

      <!-- Nombre Completo -->
      <text x="0" y="74" class="ui-sans" fill="url(#titleWhite)" font-size="33" font-weight="800" letter-spacing="-0.5">
        Jordan Stewart Zabala Correa
      </text>

      <!-- Carrera y Enfoque Real -->
      <text x="0" y="106" class="ui-sans" fill="url(#orangeUHE)" font-size="18.5" font-weight="700" letter-spacing="1">
        TECNOLOGÍAS DE LA INFORMACIÓN • PROGRAMACIÓN
      </text>

      <!-- Descripción 100% Real y Honesta -->
      <text x="0" y="136" class="ui-sans" fill="#cbd5e1" font-size="13.5">
        Iniciando mi carrera en TI en la <tspan fill="#ffffff" font-weight="600">UHE</tspan> y aprendiendo <tspan fill="#ff7a00" font-weight="600">Fundamentos de Programación</tspan> con Python.
      </text>

      <!-- 4 Badges Reales en Estilo UHE -->
      <g transform="translate(0, 164)">
        <rect x="0" y="0" width="190" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="95" y="21" text-anchor="middle" class="ui-mono" fill="#ff5a1f" font-size="11" font-weight="600" letter-spacing="0.8">
          [ U. HEMISFERIOS 🎓 ]
        </text>

        <rect x="202" y="0" width="180" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="292" y="21" text-anchor="middle" class="ui-mono" fill="#ffa940" font-size="11" font-weight="600" letter-spacing="0.8">
          [ PYTHON INICIAL 🐍 ]
        </text>

        <rect x="0" y="44" width="190" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="95" y="65" text-anchor="middle" class="ui-mono" fill="#ffffff" font-size="11" font-weight="600" letter-spacing="0.8">
          [ FUNDAMENTOS TI 💻 ]
        </text>

        <rect x="202" y="44" width="180" height="34" rx="8" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
        <text x="292" y="65" text-anchor="middle" class="ui-mono" fill="#e2e8f0" font-size="11" font-weight="600" letter-spacing="0.8">
          [ PASIÓN MOTOS 🏍️ ]
        </text>
      </g>

    </g>

    <!-- ================================================================= -->
    <!-- LADO DERECHO: OBSERVATORIO UHE & OCTOCAT / PYTHON CORE             -->
    <!-- ================================================================= -->
    <g transform="translate(775, 175)">
      <circle cx="0" cy="0" r="128" fill="none" stroke="#1e2629" stroke-width="1" stroke-dasharray="4 8"/>

      <!-- Anillo Orbital Naranja UHE -->
      <g class="orbit-cw">
        <circle cx="0" cy="0" r="112" fill="none" stroke="url(#orbitUHE)" stroke-width="2"/>
        <circle cx="0" cy="-112" r="4.5" fill="#ff5a1f" filter="url(#softGlow)"/>
        <circle cx="112" cy="0" r="3" fill="#ffa940"/>
      </g>

      <!-- Anillo Elíptico 3D -->
      <g transform="rotate(-24) scale(1, 0.42)">
        <circle cx="0" cy="0" r="148" fill="none" stroke="#ff7a00" stroke-width="3" stroke-opacity="0.65" filter="url(#softGlow)"/>
        <circle cx="0" cy="0" r="136" fill="none" stroke="#ffa940" stroke-width="1.5" stroke-dasharray="40 20" class="orbit-cw"/>
      </g>

      <!-- Anillo Antihorario -->
      <g class="orbit-ccw">
        <circle cx="0" cy="0" r="84" fill="none" stroke="#ffa940" stroke-width="1.2" stroke-dasharray="28 16" stroke-opacity="0.65"/>
        <circle cx="-84" cy="0" r="3.5" fill="#ff5a1f" filter="url(#softGlow)"/>
      </g>

      <!-- Núcleo Central Flotante -->
      <g class="float-core">
        <polygon points="0,-68 58,-34 58,34 0,68 -58,34 -58,-34" fill="url(#glassFill)" stroke="url(#orangeUHE)" stroke-width="2" filter="url(#softGlow)"/>
        <polygon points="0,-58 49,-28 49,28 0,58 -49,28 -49,-28" fill="#0d1216" stroke="#1e2629" stroke-width="1"/>

        <!-- Líneas de circuito UHE -->
        <g stroke="#ff7a00" stroke-width="0.9" stroke-opacity="0.55">
          <line x1="0" y1="-58" x2="0" y2="-38"/>
          <line x1="49" y1="-28" x2="32" y2="-18"/>
          <line x1="-49" y1="-28" x2="-32" y2="-18"/>
          <line x1="49" y1="28" x2="32" y2="18"/>
          <line x1="-49" y1="28" x2="-32" y2="18"/>
        </g>

        <!-- Silueta Octocat en Naranja UHE -->
        <circle cx="0" cy="0" r="28" fill="#141c22" stroke="url(#glassBorder)" stroke-width="1.5"/>
        <path d="M -14 -6 L -16 -17 L -7 -12 Q 0 -15 7 -12 L 16 -17 L 14 -6 C 18 2, 16 12, 8 15 L 8 22 L -8 22 L -8 15 C -16 12, -18 2, -14 -6 Z" 
              fill="url(#orangeUHE)" opacity="0.95"/>
        <rect x="-9" y="-4" width="6" height="3" rx="1.5" fill="#0a0e12"/>
        <rect x="3" y="-4" width="6" height="3" rx="1.5" fill="#0a0e12"/>
      </g>

      <text x="-135" y="-112" class="ui-mono" fill="#8b959e" font-size="9" letter-spacing="1">CAMPUS // UHE</text>
      <text x="58" y="122" class="ui-mono" fill="#ff7a00" font-size="9" letter-spacing="1">SEMESTRE I // 2026</text>
    </g>

    <!-- Marco HUD -->
    <rect x="12" y="12" width="976" height="326" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="28" y="326" class="ui-mono" fill="#64748b" font-size="9" letter-spacing="1.5">UNIVERSIDAD HEMISFERIOS • FACULTAD DE TI</text>
    <text x="805" y="326" class="ui-mono" fill="#ff7a00" font-size="9" letter-spacing="1.5">STEWART-ZABALA-TI</text>

    <!-- Borde Exterior -->
    <rect x="0.75" y="0.75" width="998.5" height="348.5" rx="17.25" fill="none" stroke="url(#glassBorder)" stroke-width="1.5"/>
  </g>
</svg>
