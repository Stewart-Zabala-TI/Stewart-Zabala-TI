<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowBento" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }

    .status-dot {
      animation: pulseGreen 1.6s ease-in-out infinite;
    }
    .synapse {
      stroke-dasharray: 5 5;
      animation: synapseFlow 1.2s linear infinite;
    }
    .neuron {
      animation: neuronGlow 1.8s ease-in-out infinite alternate;
    }
    .orbit-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinSlow 8s linear infinite;
    }
    .orbit-ring-rev {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinRev 5s linear infinite;
    }
    .bar-1 { animation: barBounce1 2.2s ease-in-out infinite alternate; }
    .bar-2 { animation: barBounce2 1.8s ease-in-out infinite alternate; }
    .bar-3 { animation: barBounce3 2.5s ease-in-out infinite alternate; }
    .telemetry-wave {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      animation: drawWave 2.8s linear infinite;
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; r: 4.5px; }
      50% { opacity: 0.35; r: 6.5px; }
    }
    @keyframes synapseFlow {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes neuronGlow {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes barBounce1 {
      from { width: 145px; }
      to { width: 175px; }
    }
    @keyframes barBounce2 {
      from { width: 120px; }
      to { width: 162px; }
    }
    @keyframes barBounce3 {
      from { width: 135px; }
      to { width: 170px; }
    }
    @keyframes drawWave {
      0% { stroke-dashoffset: 320; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -320; }
    }
  </style>

  <!-- ================================================= -->
  <!-- CARD 1 (IZQUIERDA GRANDE): SOBRE MÍ / BENTO BIO   -->
  <!-- ================================================= -->
  <g transform="translate(8, 8)">
    <rect width="530" height="374" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.5"/>
    <rect x="0" y="24" width="4" height="45" rx="2" fill="#00f2fe" filter="url(#glowBento)"/>

    <!-- Badge de estado online -->
    <rect x="26" y="22" width="215" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="40" cy="34" r="4.5" fill="#00f2fe" class="status-dot" filter="url(#glowBento)"/>
    <text x="54" y="38" class="mono" fill="#c9d1d9" font-size="10" font-weight="600">SYSTEM ONLINE // ECUADOR</text>

    <!-- Título de la tarjeta -->
    <text x="26" y="76" class="sans" fill="#ffffff" font-size="22" font-weight="700">Ingeniería, Ciencia de Datos &amp; IA</text>
    <text x="26" y="100" class="sans" fill="#8b949e" font-size="13">
      Soy <tspan fill="#58a6ff" font-weight="600">Jordan Stewart Zabala Correa</tspan>. Transformo datos complejos
    </text>
    <text x="26" y="119" class="sans" fill="#8b949e" font-size="13">
      en decisiones inteligentes mediante <tspan fill="#00f2fe" font-weight="600">Ciencia de Datos e IA</tspan>.
    </text>

    <line x1="26" y1="138" x2="504" y2="138" stroke="#21262d" stroke-width="1"/>

    <!-- Bloques de Especialidad -->
    <!-- Item 1 -->
    <g transform="translate(26, 156)">
      <rect width="478" height="56" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#0d1117" stroke="#00f2fe" stroke-width="1.5"/>
      <text x="23" y="33" class="mono" fill="#00f2fe" font-size="12" font-weight="700">AI</text>
      <text x="54" y="24" class="sans" fill="#f0f6fc" font-size="13.5" font-weight="600">Ciencia de Datos e Inteligencia Artificial</text>
      <text x="54" y="43" class="sans" fill="#8b949e" font-size="12">Modelado predictivo, analítica avanzada y procesamiento de datos.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(26, 224)">
      <rect width="478" height="56" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="21" y="33" class="mono" fill="#58a6ff" font-size="12" font-weight="700">PY</text>
      <text x="54" y="24" class="sans" fill="#f0f6fc" font-size="13.5" font-weight="600">Desarrollo &amp; Automatización con Python</text>
      <text x="54" y="43" class="sans" fill="#8b949e" font-size="12">Código limpio, modular y enfocado en rendimiento y escalabilidad.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(26, 292)">
      <rect width="478" height="56" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#0d1117" stroke="#ff0844" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" fill="#ff0844" font-size="11" font-weight="700">R1</text>
      <text x="54" y="24" class="sans" fill="#f0f6fc" font-size="13.5" font-weight="600">ADN Motociclista: Precisión y Telemetría</text>
      <text x="54" y="43" class="sans" fill="#8b949e" font-size="12">La misma disciplina de una moto en pista llevada a la arquitectura de software.</text>
    </g>
  </g>

  <!-- ================================================= -->
  <!-- CARD 2 (ARRIBA DERECHA): RED NEURONAL ANIMADA     -->
  <!-- ================================================= -->
  <g transform="translate(552, 8)">
    <rect width="440" height="180" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.5"/>
    <text x="22" y="30" class="mono" fill="#00f2fe" font-size="11" font-weight="700" letter-spacing="1.2">NEURAL NETWORK // DEEP LEARNING</text>
    <text x="345" y="30" class="mono" fill="#58a6ff" font-size="11" font-weight="700">ACTIVE</text>

    <!-- Grafo de Red Neuronal Animado -->
    <g transform="translate(45, 48)">
      <!-- Sinapsis -->
      <g stroke="#30363d" stroke-width="1.2">
        <line x1="25" y1="20" x2="115" y2="12"/>
        <line x1="25" y1="20" x2="115" y2="45"/>
        <line x1="25" y1="20" x2="115" y2="78"/>
        <line x1="25" y1="55" x2="115" y2="12"/>
        <line x1="25" y1="55" x2="115" y2="45"/>
        <line x1="25" y1="55" x2="115" y2="78"/>
        <line x1="25" y1="90" x2="115" y2="45"/>
        <line x1="25" y1="90" x2="115" y2="78"/>
      </g>
      <!-- Sinapsis activas animadas -->
      <g stroke="#00f2fe" stroke-width="1.5" class="synapse">
        <line x1="25" y1="20" x2="115" y2="45"/>
        <line x1="25" y1="55" x2="115" y2="12"/>
        <line x1="25" y1="90" x2="115" y2="78"/>
        <line x1="115" y1="12" x2="205" y2="32"/>
        <line x1="115" y1="45" x2="205" y2="32"/>
        <line x1="115" y1="45" x2="205" y2="72"/>
        <line x1="115" y1="78" x2="205" y2="72"/>
        <line x1="205" y1="32" x2="285" y2="52" stroke="#ff0844"/>
        <line x1="205" y1="72" x2="285" y2="52" stroke="#ff0844"/>
      </g>

      <!-- Capa de Entrada -->
      <circle cx="25" cy="20" r="6" fill="#0d1117" stroke="#00f2fe" stroke-width="2" class="neuron"/>
      <circle cx="25" cy="55" r="6" fill="#0d1117" stroke="#00f2fe" stroke-width="2" class="neuron"/>
      <circle cx="25" cy="90" r="6" fill="#0d1117" stroke="#00f2fe" stroke-width="2" class="neuron"/>

      <!-- Capa Oculta 1 -->
      <circle cx="115" cy="12" r="6.5" fill="#1f6feb" stroke="#58a6ff" stroke-width="2" class="neuron"/>
      <circle cx="115" cy="45" r="6.5" fill="#1f6feb" stroke="#00f2fe" stroke-width="2" class="neuron" filter="url(#glowBento)"/>
      <circle cx="115" cy="78" r="6.5" fill="#1f6feb" stroke="#58a6ff" stroke-width="2" class="neuron"/>

      <!-- Capa Oculta 2 -->
      <circle cx="205" cy="32" r="7" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5" class="neuron" filter="url(#glowBento)"/>
      <circle cx="205" cy="72" r="7" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5" class="neuron" filter="url(#glowBento)"/>

      <!-- Nodo de Salida (Predicción IA) -->
      <circle cx="285" cy="52" r="9" fill="#ff0844" stroke="#ffffff" stroke-width="2" filter="url(#glowBento)"/>
    </g>

    <!-- Etiquetas inferiores -->
    <text x="22" y="164" class="mono" fill="#8b949e" font-size="10">INPUT: RAW DATA</text>
    <text x="175" y="164" class="mono" fill="#8b949e" font-size="10">HIDDEN LAYERS</text>
    <text x="315" y="164" class="mono" fill="#ff0844" font-size="10" font-weight="700">OUTPUT: AI MODEL</text>
  </g>

  <!-- ================================================= -->
  <!-- CARD 3 (ABAJO DERECHA): MOTOR PYTHON & MÉTRICAS   -->
  <!-- ================================================= -->
  <g transform="translate(552, 202)">
    <rect width="440" height="180" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.5"/>
    <text x="22" y="30" class="mono" fill="#ff0844" font-size="11" font-weight="700" letter-spacing="1.2">CORE ENGINE // PYTHON &amp; TELEMETRY</text>

    <!-- Reactor Orbital Python (Izquierda de la tarjeta) -->
    <g transform="translate(76, 102)">
      <circle cx="0" cy="0" r="44" fill="none" stroke="#161b22" stroke-width="6"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="45 25" class="orbit-ring" filter="url(#glowBento)"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ff0844" stroke-width="2" stroke-dasharray="20 18" class="orbit-ring-rev"/>
      <circle cx="0" cy="0" r="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="-15" y="5" class="mono" fill="#ffffff" font-size="13" font-weight="700">100%</text>
      <text x="-18" y="62" class="mono" fill="#58a6ff" font-size="10" font-weight="700">PYTHON</text>
    </g>

    <!-- Barras de Rendimiento Animadas + Onda TI-Metrics (Derecha de la tarjeta) -->
    <g transform="translate(155, 52)">
      <!-- Métrica 1 -->
      <text x="0" y="12" class="mono" fill="#c9d1d9" font-size="10">Data Analytics &amp; Logs</text>
      <rect x="0" y="18" width="190" height="7" rx="3.5" fill="#161b22"/>
      <rect x="0" y="18" width="165" height="7" rx="3.5" fill="url(#accentGrad)" class="bar-1"/>

      <!-- Métrica 2 -->
      <text x="0" y="42" class="mono" fill="#c9d1d9" font-size="10">AI &amp; Machine Learning</text>
      <rect x="0" y="48" width="190" height="7" rx="3.5" fill="#161b22"/>
      <rect x="0" y="48" width="145" height="7" rx="3.5" fill="url(#crimsonGrad)" class="bar-2"/>

      <!-- Métrica 3 -->
      <text x="0" y="72" class="mono" fill="#c9d1d9" font-size="10">Infra Monitoring (TI-Metrics)</text>
      <rect x="0" y="78" width="190" height="7" rx="3.5" fill="#161b22"/>
      <rect x="0" y="78" width="160" height="7" rx="3.5" fill="url(#accentGrad)" class="bar-3"/>

      <!-- Pulso de Telemetría en Vivo -->
      <g transform="translate(0, 96)">
        <path d="M 0 15 L 35 15 L 48 4 L 58 24 L 70 8 L 82 18 L 95 15 L 145 15 L 158 3 L 168 23 L 180 15 L 255 15" 
              fill="none" stroke="#21262d" stroke-width="1.5"/>
        <path d="M 0 15 L 35 15 L 48 4 L 58 24 L 70 8 L 82 18 L 95 15 L 145 15 L 158 3 L 168 23 L 180 15 L 255 15" 
              fill="none" stroke="#00f2fe" stroke-width="2" class="telemetry-wave" filter="url(#glowBento)"/>
      </g>
    </g>
  </g>
</svg>
