<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="100%" height="100%">
  <defs>
    <linearGradient id="telBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="100%" stop-color="#0d121c"/>
    </linearGradient>
    <linearGradient id="langBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="55%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
    <filter id="telGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .bar-shimmer {
      animation: pulseWidth 2.8s ease-in-out infinite alternate;
    }
    .ring-rot {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinRing 6s linear infinite;
    }
    @keyframes pulseWidth {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }
    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- TARJETA IZQUIERDA: LENGUAJE MÁS USADO (PYTHON) -->
  <g transform="translate(8, 8)">
    <rect width="484" height="158" rx="14" fill="url(#telBg)" stroke="#21262d" stroke-width="1.5"/>
    <text x="26" y="34" class="sans" fill="#00f2fe" font-size="16" font-weight="700">Lenguaje Más Usado</text>
    <text x="385" y="34" class="mono" fill="#58a6ff" font-size="11" font-weight="700">TOP LANGUAGE</text>

    <!-- Barra de progreso 100% Python -->
    <rect x="26" y="54" width="432" height="12" rx="6" fill="#161b22"/>
    <rect x="26" y="54" width="432" height="12" rx="6" fill="url(#langBarGrad)" class="bar-shimmer" filter="url(#telGlow)"/>

    <!-- Detalle de Lenguaje -->
    <circle cx="36" cy="94" r="6" fill="#00f2fe" filter="url(#telGlow)"/>
    <text x="50" y="98" class="sans" fill="#ffffff" font-size="14" font-weight="700">Python</text>
    <text x="110" y="98" class="mono" fill="#00f2fe" font-size="13" font-weight="700">100.0%</text>
    <text x="26" y="128" class="mono" fill="#8b949e" font-size="11">
      Enfoque exclusivo en desarrollo con Python, Ciencia de Datos e IA.
    </text>
  </g>

  <!-- TARJETA DERECHA: TELEMETRÍA Y ACTIVIDAD DEL PERFIL -->
  <g transform="translate(508, 8)">
    <rect width="484" height="158" rx="14" fill="url(#telBg)" stroke="#21262d" stroke-width="1.5"/>
    <text x="26" y="34" class="sans" fill="#00f2fe" font-size="16" font-weight="700">Estadísticas de Stewart-Zabala-TI</text>

    <g transform="translate(26, 58)" class="sans" font-size="13" fill="#c9d1d9">
      <text x="0" y="14">⚡ <tspan font-weight="600">Especialidad:</tspan></text>
      <text x="155" y="14" class="mono" fill="#00f2fe" font-weight="700">Ciencia de Datos &amp; IA</text>

      <text x="0" y="40">🐍 <tspan font-weight="600">Lenguaje Base:</tspan></text>
      <text x="155" y="40" class="mono" fill="#58a6ff" font-weight="700">Python 3</text>

      <text x="0" y="66">📦 <tspan font-weight="600">Repositorios Activos:</tspan></text>
      <text x="155" y="66" class="mono" fill="#ffffff" font-weight="700">TI-Metrics &amp; Profile Skin</text>
    </g>

    <!-- Anillo de Nivel / Rank Derecha -->
    <g transform="translate(405, 86)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#161b22" stroke-width="6"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="60 22" class="ring-rot" filter="url(#telGlow)"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ff0844" stroke-width="1.5" stroke-dasharray="15 10"/>
      <text x="0" y="5" text-anchor="middle" class="mono" fill="#ffffff" font-size="15" font-weight="700">PRO</text>
    </g>
  </g>
</svg>
