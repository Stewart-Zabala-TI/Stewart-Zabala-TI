<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 225" width="100%" height="100%">
  <defs>
    <linearGradient id="snakeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <linearGradient id="snakeSpec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Serpiente en Titanio, Azul Cobalto y Azul Hielo Eléctrico -->
    <linearGradient id="luxSnakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="luxSnakeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="luxGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="13" height="13" rx="3.5" fill="#0f1520" stroke="#1e293b" stroke-opacity="0.45" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .ui-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }

    .lux-snake-path {
      stroke-dasharray: 170 1600;
      stroke-dashoffset: 1770;
      animation: glideSnake 7s linear infinite;
    }

    .gem-1 { animation: gemPulse 7s ease-in-out infinite; }
    .gem-2 { animation: gemPulse 7s ease-in-out 1.6s infinite; }
    .gem-3 { animation: gemPulse 7s ease-in-out 3.2s infinite; }
    .gem-4 { animation: gemPulse 7s ease-in-out 4.8s infinite; }

    @keyframes glideSnake {
      0% { stroke-dashoffset: 1770; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes gemPulse {
      0%, 35% { opacity: 1; }
      45%, 80% { opacity: 0.22; }
      95%, 100% { opacity: 1; }
    }
  </style>

  <g transform="translate(4, 4)">
    <rect width="992" height="216" rx="16" fill="url(#snakeGlass)" stroke="url(#snakeSpec)" stroke-width="1.2"/>

    <text x="36" y="32" class="ui-mono" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1.5">
      06 // CONTRIBUTION SNAKE • ACTIVIDAD EN GITHUB
    </text>
    <text x="820" y="32" class="ui-mono" fill="#00d2ff" font-size="10" font-weight="600">
      STEWART-ZABALA-TI
    </text>

    <!-- Matriz de Contribuciones (50x7) en Azul Cobalto, Hielo y Acero -->
    <g transform="translate(46, 46)">
      <rect x="0" y="0" width="900" height="126" fill="url(#luxGrid)"/>

      <g transform="translate(2, 2)">
        <rect x="54" y="18" width="13" height="13" rx="3.5" fill="#172554"/>
        <rect x="126" y="36" width="13" height="13" rx="3.5" fill="#00d2ff" class="gem-1" filter="url(#luxSnakeGlow)"/>
        <rect x="198" y="36" width="13" height="13" rx="3.5" fill="#1e3a8a"/>
        <rect x="270" y="90" width="13" height="13" rx="3.5" fill="#38bdf8" class="gem-2" filter="url(#luxSnakeGlow)"/>
        <rect x="342" y="18" width="13" height="13" rx="3.5" fill="#0284c7"/>
        <rect x="432" y="18" width="13" height="13" rx="3.5" fill="#e2e8f0" class="gem-3" filter="url(#luxSnakeGlow)"/>
        <rect x="504" y="54" width="13" height="13" rx="3.5" fill="#1e3a8a"/>
        <rect x="576" y="90" width="13" height="13" rx="3.5" fill="#00d2ff" class="gem-2" filter="url(#luxSnakeGlow)"/>
        <rect x="648" y="36" width="13" height="13" rx="3.5" fill="#0284c7"/>
        <rect x="720" y="36" width="13" height="13" rx="3.5" fill="#38bdf8" class="gem-4" filter="url(#luxSnakeGlow)"/>
        <rect x="792" y="72" width="13" height="13" rx="3.5" fill="#0369a1"/>

        <!-- Contribuciones Recientes -->
        <rect x="846" y="0" width="13" height="13" rx="3.5" fill="#00d2ff" filter="url(#luxSnakeGlow)"/>
        <rect x="864" y="0" width="13" height="13" rx="3.5" fill="#38bdf8" filter="url(#luxSnakeGlow)"/>
        <rect x="882" y="18" width="13" height="13" rx="3.5" fill="#e2e8f0" filter="url(#luxSnakeGlow)"/>
        <rect x="864" y="108" width="13" height="13" rx="3.5" fill="#00d2ff" filter="url(#luxSnakeGlow)"/>
      </g>

      <path d="M 8 24 
               L 134 24 
               L 134 42 
               L 278 42 
               L 278 96 
               L 350 96 
               L 350 24 
               L 440 24 
               L 440 60 
               L 584 60 
               L 584 96 
               L 656 96 
               L 656 42 
               L 728 42 
               L 728 78 
               L 854 78 
               L 854 6 
               L 892 6" 
            fill="none" 
            stroke="url(#luxSnakeGrad)" 
            stroke-width="9" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            class="lux-snake-path" 
            filter="url(#luxSnakeGlow)"/>
    </g>

    <!-- Pie de la Matriz -->
    <g transform="translate(46, 194)">
      <text x="0" y="0" class="ui-sans" fill="#64748b" font-size="11">
        Cada bloque iluminado representa actividad, commits y aprendizaje continuo en GitHub.
      </text>
      <text x="728" y="0" class="ui-mono" fill="#64748b" font-size="9.5">MENOS</text>
      <rect x="772" y="-9" width="10" height="10" rx="2.5" fill="#0f1520" stroke="#1e293b"/>
      <rect x="786" y="-9" width="10" height="10" rx="2.5" fill="#172554"/>
      <rect x="800" y="-9" width="10" height="10" rx="2.5" fill="#0284c7"/>
      <rect x="814" y="-9" width="10" height="10" rx="2.5" fill="#38bdf8"/>
      <rect x="828" y="-9" width="10" height="10" rx="2.5" fill="#00d2ff"/>
      <text x="844" y="0" class="ui-mono" fill="#64748b" font-size="9.5">MÁS</text>
    </g>
  </g>
</svg>
