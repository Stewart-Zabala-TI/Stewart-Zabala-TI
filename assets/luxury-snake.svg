<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <linearGradient id="snakeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141b21"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </linearGradient>

    <linearGradient id="snakeSpec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ff7a00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Serpiente en Naranja Institucional UHE -->
    <linearGradient id="uheSnakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2629" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff5a1f"/>
      <stop offset="85%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffa940"/>
    </linearGradient>

    <filter id="snakeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="realGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="13" height="13" rx="3" fill="#141c22" stroke="#1f2830" stroke-opacity="0.5" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .ui-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }

    /* La serpiente recorre el tablero cazando las contribuciones de Octubre */
    .snake-travel {
      stroke-dasharray: 180 1400;
      stroke-dashoffset: 1580;
      animation: huntRealCommits 6.5s linear infinite;
    }

    .real-commit-glow {
      animation: commitBlink 2.2s ease-in-out infinite alternate;
    }

    @keyframes huntRealCommits {
      0% { stroke-dashoffset: 1580; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes commitBlink {
      0% { opacity: 0.75; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }
  </style>

  <g transform="translate(4, 4)">
    <rect width="992" height="222" rx="16" fill="url(#snakeGlass)" stroke="url(#snakeSpec)" stroke-width="1.2"/>

    <!-- Cabecera con datos reales del usuario -->
    <text x="36" y="32" class="ui-mono" fill="#8c97a0" font-size="10" font-weight="600" letter-spacing="1.5">
      06 // CONTRIBUTION SNAKE • <tspan fill="#ffffff">17 CONTRIBUCIONES REALES EN EL ÚLTIMO AÑO</tspan>
    </text>
    <text x="820" y="32" class="ui-mono" fill="#ff5a1f" font-size="10" font-weight="600">
      STEWART-ZABALA-TI
    </text>

    <!-- Meses Reales de tu Calendario de GitHub -->
    <g transform="translate(46, 48)" class="ui-mono" font-size="9" fill="#8c97a0">
      <text x="0" y="0">Oct</text>
      <text x="68" y="0">Nov</text>
      <text x="142" y="0">Dic</text>
      <text x="215" y="0">Ene</text>
      <text x="290" y="0">Feb</text>
      <text x="365" y="0">Mar</text>
      <text x="440" y="0">Abr</text>
      <text x="515" y="0">Puede</text>
      <text x="590" y="0">Jun</text>
      <text x="665" y="0">Jul</text>
      <text x="740" y="0">Ago</text>
      <text x="815" y="0">Sep</text>
      <text x="872" y="0" fill="#ff7a00" font-weight="700">Oct</text>
    </g>

    <!-- Tablero de Contribuciones (50 columnas x 7 filas) -->
    <g transform="translate(46, 56)">
      <!-- Celdas vacías del año -->
      <rect x="0" y="0" width="900" height="126" fill="url(#realGrid)"/>

      <!-- TUS 17 CONTRIBUCIONES REALES (EXACTAS DE TU CAPTURA EN OCTUBRE) -->
      <g transform="translate(2, 2)">
        <!-- Columna 48 (Penúltima semana de Octubre) -->
        <!-- Lunes / Martes (Commit oscuro) -->
        <rect x="846" y="18" width="13" height="13" rx="3" fill="#0e4429"/>
        <!-- Viernes (Commit verde brillante Octubre) -->
        <rect x="846" y="90" width="13" height="13" rx="3" fill="#39d353" class="real-commit-glow" filter="url(#snakeGlow)"/>

        <!-- Columna 49 (Última semana de Octubre) -->
        <!-- Domingo (Commit verde claro) -->
        <rect x="864" y="0" width="13" height="13" rx="3" fill="#39d353" class="real-commit-glow" filter="url(#snakeGlow)"/>
        <!-- Lunes (Commit verde medio) -->
        <rect x="864" y="18" width="13" height="13" rx="3" fill="#26a641" filter="url(#snakeGlow)"/>
        <!-- Hoy (Actividad reciente en tus repos) -->
        <rect x="882" y="18" width="13" height="13" rx="3" fill="#ff5a1f" class="real-commit-glow" filter="url(#snakeGlow)"/>
        <rect x="882" y="36" width="13" height="13" rx="3" fill="#ffa940" filter="url(#snakeGlow)"/>
      </g>

      <!-- Serpiente Naranja UHE recorriendo el tablero directo a tus commits reales -->
      <path d="M 12 18 
               L 160 18 
               L 160 54 
               L 320 54 
               L 320 18 
               L 480 18 
               L 480 72 
               L 640 72 
               L 640 18 
               L 780 18 
               L 780 90 
               L 852 90 
               L 852 24 
               L 870 24 
               L 870 6 
               L 888 6 
               L 888 42" 
            fill="none" 
            stroke="url(#uheSnakeGrad)" 
            stroke-width="9" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            class="snake-travel" 
            filter="url(#snakeGlow)"/>
    </g>

    <!-- Leyenda Inferior con tus datos reales -->
    <g transform="translate(46, 202)">
      <text x="0" y="0" class="ui-sans" fill="#cbd5e1" font-size="11">
        Perfil nuevo: <tspan fill="#ffffff" font-weight="600">17 contribuciones registradas en Octubre</tspan> tras crear los repositorios de TI.
      </text>
      <text x="735" y="0" class="ui-mono" fill="#8c97a0" font-size="9.5">Menos</text>
      <rect x="778" y="-9" width="10" height="10" rx="2.5" fill="#141c22" stroke="#1f2830"/>
      <rect x="792" y="-9" width="10" height="10" rx="2.5" fill="#0e4429"/>
      <rect x="806" y="-9" width="10" height="10" rx="2.5" fill="#006d32"/>
      <rect x="820" y="-9" width="10" height="10" rx="2.5" fill="#26a641"/>
      <rect x="834" y="-9" width="10" height="10" rx="2.5" fill="#39d353"/>
      <text x="852" y="0" class="ui-mono" fill="#8c97a0" font-size="9.5">Más</text>
    </g>
  </g>
</svg>
