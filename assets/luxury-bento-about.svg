<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" width="100%" height="100%">
  <defs>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141b21"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </linearGradient>

    <linearGradient id="innerCard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b242c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12181e" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="borderSpec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ff7a00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="60%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffa940"/>
    </linearGradient>

    <linearGradient id="areaGraph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ff7a00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cardGlow1" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cardGlow2" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffa940" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0"/>
    </radialGradient>

    <filter id="uheBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .ui-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }

    .synapse-flow {
      stroke-dasharray: 5 6;
      animation: flowAnim 1.6s linear infinite;
    }
    .node-breathe {
      animation: breathe 2.2s ease-in-out infinite alternate;
    }
    .spline-draw {
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      animation: drawSpline 4s ease-in-out infinite alternate;
    }
    .dot-float {
      animation: floatDot 2.5s ease-in-out infinite alternate;
    }

    @keyframes flowAnim { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
    @keyframes breathe { from { opacity: 0.45; } to { opacity: 1; } }
    @keyframes drawSpline { 0% { stroke-dashoffset: 220; } 100% { stroke-dashoffset: 0; } }
    @keyframes floatDot { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
  </style>

  <!-- ========================================================= -->
  <!-- TARJETA 1 (IZQUIERDA): SOBRE MÍ (DATOS REALES UHE)        -->
  <!-- ========================================================= -->
  <g transform="translate(4, 4)">
    <rect width="540" height="356" rx="16" fill="url(#glassCard)" stroke="url(#borderSpec)" stroke-width="1.2"/>
    <rect width="540" height="356" rx="16" fill="url(#cardGlow1)"/>

    <text x="28" y="34" class="ui-mono" fill="#8c97a0" font-size="10" font-weight="600" letter-spacing="1.5">
      01 // PERFIL ACADÉMICO REAL
    </text>
    <circle cx="508" cy="30" r="4" fill="#ff5a1f" filter="url(#uheBloom)"/>

    <text x="28" y="66" class="ui-sans" fill="#ffffff" font-size="21.5" font-weight="700" letter-spacing="-0.3">
      Estudiante de TI • U. Hemisferios
    </text>
    <text x="28" y="92" class="ui-sans" fill="#cbd5e1" font-size="13">
      Soy <tspan fill="#ffffff" font-weight="600">Jordan Stewart Zabala Correa</tspan>, estudiante de TI en la UHE.
    </text>
    <text x="28" y="111" class="ui-sans" fill="#cbd5e1" font-size="13">
      Aprendiendo desde cero <tspan fill="#ff7a00" font-weight="600">Fundamentos de Programación con Python</tspan>.
    </text>

    <!-- Pilar 1 -->
    <g transform="translate(28, 134)">
      <rect width="484" height="60" rx="12" fill="url(#innerCard)" stroke="url(#borderSpec)" stroke-width="1"/>
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#0d1318" stroke="#ff5a1f" stroke-opacity="0.5"/>
      <text x="30" y="34" text-anchor="middle" class="ui-mono" fill="#ff5a1f" font-size="11" font-weight="700">UHE</text>
      <text x="58" y="26" class="ui-sans" fill="#ffffff" font-size="13.5" font-weight="600">Universidad Hemisferios (Quito, Ecuador)</text>
      <text x="58" y="44" class="ui-sans" fill="#94a3b8" font-size="12">Estudiante de la carrera de Tecnologías de la Información.</text>
    </g>

    <!-- Pilar 2 -->
    <g transform="translate(28, 204)">
      <rect width="484" height="60" rx="12" fill="url(#innerCard)" stroke="url(#borderSpec)" stroke-width="1"/>
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#0d1318" stroke="#ffa940" stroke-opacity="0.5"/>
      <text x="30" y="34" text-anchor="middle" class="ui-mono" fill="#ffa940" font-size="11" font-weight="700">PY</text>
      <text x="58" y="26" class="ui-sans" fill="#ffffff" font-size="13.5" font-weight="600">Materia: Fundamentos de Programación</text>
      <text x="58" y="44" class="ui-sans" fill="#94a3b8" font-size="12">Construyendo bases firmes en lógica algorítmica y sintaxis con Python.</text>
    </g>

    <!-- Pilar 3 -->
    <g transform="translate(28, 274)">
      <rect width="484" height="60" rx="12" fill="url(#innerCard)" stroke="url(#borderSpec)" stroke-width="1"/>
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#0d1318" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="30" y="34" text-anchor="middle" class="ui-mono" fill="#ffffff" font-size="11" font-weight="700">🏍️</text>
      <text x="58" y="26" class="ui-sans" fill="#ffffff" font-size="13.5" font-weight="600">Pasión Personal: Motociclismo &amp; Precisión</text>
      <text x="58" y="44" class="ui-sans" fill="#94a3b8" font-size="12">Constancia, disciplina y atención al detalle en cada paso de mi aprendizaje.</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- TARJETA 2 (ARRIBA DERECHA): LÓGICA Y ESTRUCTURAS          -->
  <!-- ========================================================= -->
  <g transform="translate(556, 4)">
    <rect width="440" height="172" rx="16" fill="url(#glassCard)" stroke="url(#borderSpec)" stroke-width="1.2"/>
    <rect width="440" height="172" rx="16" fill="url(#cardGlow2)"/>

    <text x="26" y="32" class="ui-mono" fill="#8c97a0" font-size="10" font-weight="600" letter-spacing="1.5">
      02 // ESTRUCTURAS &amp; LÓGICA UHE
    </text>
    <text x="345" y="32" class="ui-mono" fill="#ff5a1f" font-size="10" font-weight="600">PYTHON 3</text>

    <!-- Red de Lógica en Naranja y Ámbar UHE -->
    <g transform="translate(52, 46)">
      <g stroke="#263138" stroke-width="1">
        <line x1="20" y1="16" x2="115" y2="10"/>
        <line x1="20" y1="16" x2="115" y2="42"/>
        <line x1="20" y1="48" x2="115" y2="10"/>
        <line x1="20" y1="48" x2="115" y2="42"/>
        <line x1="20" y1="48" x2="115" y2="74"/>
        <line x1="20" y1="80" x2="115" y2="42"/>
        <line x1="20" y1="80" x2="115" y2="74"/>
        <line x1="115" y1="10" x2="215" y2="26"/>
        <line x1="115" y1="42" x2="215" y2="26"/>
        <line x1="115" y1="42" x2="215" y2="62"/>
        <line x1="115" y1="74" x2="215" y2="62"/>
        <line x1="215" y1="26" x2="305" y2="44"/>
        <line x1="215" y1="62" x2="305" y2="44"/>
      </g>

      <g stroke="url(#orangeGrad)" stroke-width="1.5" class="synapse-flow">
        <line x1="20" y1="16" x2="115" y2="42"/>
        <line x1="20" y1="80" x2="115" y2="74"/>
        <line x1="115" y1="42" x2="215" y2="26"/>
        <line x1="115" y1="74" x2="215" y2="62"/>
        <line x1="215" y1="26" x2="305" y2="44"/>
        <line x1="215" y1="62" x2="305" y2="44"/>
      </g>

      <circle cx="20" cy="16" r="5" fill="#0e1418" stroke="#ff5a1f" stroke-width="2" class="node-breathe"/>
      <circle cx="20" cy="48" r="5" fill="#0e1418" stroke="#ff5a1f" stroke-width="2" class="node-breathe"/>
      <circle cx="20" cy="80" r="5" fill="#0e1418" stroke="#ff5a1f" stroke-width="2" class="node-breathe"/>

      <circle cx="115" cy="10" r="5.5" fill="#1b242c" stroke="#ffa940" stroke-width="2"/>
      <circle cx="115" cy="42" r="6" fill="#ff5a1f" stroke="#ffffff" stroke-width="1.5" filter="url(#uheBloom)"/>
      <circle cx="115" cy="74" r="5.5" fill="#1b242c" stroke="#ffa940" stroke-width="2"/>

      <circle cx="215" cy="26" r="6" fill="#ff7a00" stroke="#ffffff" stroke-width="1.5" filter="url(#uheBloom)"/>
      <circle cx="215" cy="62" r="6" fill="#ffa940" stroke="#ffffff" stroke-width="1.5" filter="url(#uheBloom)"/>

      <circle cx="305" cy="44" r="8" fill="#ff5a1f" stroke="#ffffff" stroke-width="2" filter="url(#uheBloom)"/>
    </g>

    <text x="26" y="152" class="ui-mono" fill="#8c97a0" font-size="9.5">INPUT: VARIABLES</text>
    <text x="172" y="152" class="ui-mono" fill="#8c97a0" font-size="9.5">BUCLES &amp; FUNCIONES</text>
    <text x="305" y="152" class="ui-mono" fill="#ff5a1f" font-size="9.5" font-weight="600">PROYECTO</text>
  </g>

  <!-- ========================================================= -->
  <!-- TARJETA 3 (ABAJO DERECHA): CURVA DE APRENDIZAJE ACADÉMICO -->
  <!-- ========================================================= -->
  <g transform="translate(556, 188)">
    <rect width="440" height="172" rx="16" fill="url(#glassCard)" stroke="url(#borderSpec)" stroke-width="1.2"/>

    <text x="26" y="32" class="ui-mono" fill="#8c97a0" font-size="10" font-weight="600" letter-spacing="1.5">
      03 // PROGRESO ACADÉMICO
    </text>
    <text x="340" y="32" class="ui-mono" fill="#ffa940" font-size="10" font-weight="600">AÑO 1 • UHE</text>

    <g transform="translate(26, 52)">
      <line x1="0" y1="25" x2="388" y2="25" stroke="#ffffff" stroke-opacity="0.04"/>
      <line x1="0" y1="55" x2="388" y2="55" stroke="#ffffff" stroke-opacity="0.04"/>
      <line x1="0" y1="85" x2="388" y2="85" stroke="#ffffff" stroke-opacity="0.04"/>

      <path d="M 0 82 Q 65 75, 115 55 T 235 38 T 388 12 L 388 92 L 0 92 Z" fill="url(#areaGraph)"/>
      <path d="M 0 82 Q 65 75, 115 55 T 235 38 T 388 12" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-linecap="round" class="spline-draw" filter="url(#uheBloom)"/>

      <circle cx="115" cy="55" r="4" fill="#0e1418" stroke="#ff5a1f" stroke-width="2"/>
      <circle cx="235" cy="38" r="4" fill="#0e1418" stroke="#ff7a00" stroke-width="2"/>
      <circle cx="388" cy="12" r="5" fill="#ffa940" stroke="#ffffff" stroke-width="1.5" class="dot-float" filter="url(#uheBloom)"/>
    </g>

    <text x="26" y="156" class="ui-mono" fill="#cbd5e1" font-size="10">
      Bases firmes: <tspan fill="#ff7a00" font-weight="600">Lógica computacional y desarrollo con Python</tspan>
    </text>
  </g>
</svg>
